name: Build, Test, and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and creating Releases
permissions:
  contents: write
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck
        run: npx tsc --noEmit

      - name: Run Tests
        run: npm test

      - name: Build App
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create or Update GitHub Release with Live URL
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Live Game Release v1.0.0"
          body: |
            ## 🎮 Cyberpunk Glassmorphism Tic-Tac-Toe Live Release
            
            The latest build of the game has been compiled, tested, and deployed to production.
            
            👉 **[PLAY THE GAME LIVE HERE](${{ steps.deployment.outputs.page_url }})**
            
            ### Features included:
            - Unbeatable Minimax AI
            - Dynamic Board Dimensions (3x3, 4x4, 5x5)
            - Procedural sound generator
            - HTML5 Canvas fireworks celebrations
            - Glassmorphism themes
            - Persistent leaderboard & match history
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
